# Правила доступа и роутинг DCMS для боевого nginx.
#
# Куда класть: /etc/nginx/vhosts-resources/<домен>/dcms.conf
# Этот каталог ispmanager подключает внутрь обоих server-блоков сайта
# (include /etc/nginx/vhosts-resources/<домен>/*.conf) и НЕ перезаписывает
# при сохранении настроек сайта в панели — в отличие от самого vhost-файла.
#
# Зачем: пока сайт обслуживал Apache, всё это задавали .htaccess — корневой и
# 23 вложенных. При переходе на nginx + PHP-FPM они не читаются вообще, и без
# переноса правил наружу открыты sys/ini/settings.ini с паролем к базе,
# исходники движка и каталог загрузок, а ссылки вида /login.php перестают
# работать: движок держит страницы в pages/, а в корне их нет.
#
# После установки: nginx -t && systemctl reload nginx
# Проверка снаружи: bash tests/smoke/run.sh https://<домен>

# Выгрузка в обменник идёт телом запроса, и по умолчанию nginx обрывает её
# задолго до PHP — upload_max_filesize здесь ни при чём.
client_max_body_size 100M;

# ---- Страницы ошибок (были ErrorDocument в .htaccess) ----------------------
error_page 400 /error.php?err=400;
error_page 401 /error.php?err=401;
error_page 402 /error.php?err=402;
error_page 403 /error.php?err=403;
error_page 404 /error.php?err=404;
error_page 500 /error.php?err=500;
error_page 502 /error.php?err=502;

# ---- Закрытые каталоги (были Deny from all) --------------------------------
# Настройки с паролем к базе и солью, исходники движка, шаблоны, загрузки
# пользователей (они отдаются скриптом, а не напрямую) и установщик.
location ^~ /sys/inc/        { deny all; }
location ^~ /sys/ini/        { deny all; }
location ^~ /sys/docs/       { deny all; }
location ^~ /sys/files/      { deny all; }
location ^~ /sys/logs/       { deny all; }
location ^~ /sys/plugins/    { deny all; }
location ^~ /sys/templates/  { deny all; }
location ^~ /sys/preinstall/ { deny all; }
location ^~ /files/inc/      { deny all; }
location ^~ /forum/inc/      { deny all; }
location ^~ /install/inc/    { deny all; }
location ^~ /sys/images/copyright/ { deny all; }
location ^~ /sys/images/captcha/   { deny all; }

# Каталоги разработки. В релиз они не заливаются, правило оставлено на случай
# ручной заливки каталога целиком.
location ^~ /vendor/ { deny all; }
location ^~ /docker/ { deny all; }
location ^~ /docs/   { deny all; }
location ^~ /tests/  { deny all; }
location ^~ /deploy/ { deny all; }

location ~* ^/(composer\.(json|lock)|docker-compose\.ya?ml|phpstan.*\.neon|phpstan-bootstrap\.php|package(-lock)?\.json)$ { deny all; }

# Только в корне сайта: в обменнике такие расширения принадлежат
# пользовательским файлам и запрещать их там нельзя.
location ~* ^/[^/]+\.(md|neon|dist|lock|sh|sql|bak|old|orig|swp|ya?ml)$ { deny all; }

# ---- Каталоги, где статика нужна, а исполнение PHP — нет -------------------
# В смайлы файл кладётся под именем, которое задал загрузивший (dpanel/smiles.php
# проверяет только то, что картинка открывается), поэтому .php здесь закрыт.
location ^~ /sys/images/ {
    location ~ /\. { deny all; }
    location ~ \.php$ { deny all; }
}

location ^~ /sys/languages/ {
    location ~ /\. { deny all; }
    location ~* \.(lng|ini)$ { deny all; }
}

location ^~ /sys/themes/ {
    location ~ /\. { deny all; }
    location ~* \.(tpl|php|ini)$ { deny all; }
}

# Виджеты закрыты, кроме ленты: её страница запрашивается браузером напрямую.
location ^~ /sys/widgets/ {
    location ~ /\. { deny all; }
    location = /sys/widgets/feed/feed.php { try_files /does_not_exists @php; }
    location ~* \.(php|ini)$ { deny all; }
}

# Временные файлы движка: наружу отдаются только public.*
location ^~ /sys/tmp/ {
    location ~ /\. { deny all; }
    location ~ ^/sys/tmp/public\. { try_files $uri =404; }
    deny all;
}

# ---- Разделы со своими правилами переадресации ----------------------------
# Префиксная локация с ^~ отключает перебор regex-локаций, поэтому запрет
# файлов, начинающихся с точки, повторяется внутри каждой из них — иначе
# .htaccess этих каталогов отдаётся посетителю целиком.
location ^~ /forum/ {
    location ~ /\. { deny all; }
    location ~ ^/forum/download/([0-9]+)/ { rewrite ^/forum/download/([0-9]+)/ /forum/file.get.php?id=$1 last; }
    location ~ \.php$ { try_files /does_not_exists @php; }
    try_files $uri $uri/ =404;
}

# Обменник: любой путь разбирает index.php, сами файлы лежат в sys/files
location ^~ /files/ {
    location ~ /\. { deny all; }
    location ~ \.php$ { try_files /does_not_exists @php; }
    try_files $uri @files_rewrite;
}

location @files_rewrite {
    rewrite ^/files/(.*)$ /files/index.php?path=$1&$args last;
}

location ^~ /pages/ {
    location ~ /\. { deny all; }
    rewrite ^/pages/bad_?browser(\.html?|\.php)$ /pages/badbrowser.php last;
    location ~ \.php$ { try_files /does_not_exists @php; }
    try_files $uri $uri/ =404;
}

# ---- Корневой fallback ----------------------------------------------------
# Главное правило старого .htaccess: RewriteRule ^([^/]+)$ pages/$1.
# Все ссылки сайта ведут на /login.php, /faq.php и подобные, а физически
# страницы лежат в pages/. Без этого правила сайт отдаёт 404 на каждой ссылке.
location ~ ^/[^/]+\.php$ {
    if (!-f $request_filename) {
        rewrite ^/(.+)$ /pages/$1 last;
    }
    try_files /does_not_exists @php;
}

# ---- Файлы, начинающиеся с точки ------------------------------------------
location ~ /\. { deny all; }
