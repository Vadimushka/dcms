; Настройки PHP для сайта на боевом сервере.
;
; Куда класть: /opt/php85/etc/php-fpm.d/site.d/<домен>.conf
; Этот каталог ispmanager отводит под настройки PHP конкретного сайта и
; создаёт файл пустым; правки панели через раздел «Настройки PHP» пишутся
; сюда же, поэтому перед изменением настроек из панели стоит заглянуть в файл.
;
; После установки: systemctl reload php-fpm85
; Проверка: страница загрузки файла в обменнике должна принимать большие файлы

; ---- Загрузка файлов -------------------------------------------------------
; Глобальные значения сервера (2M на файл, 8M на запрос) для движка с
; обменником бессмысленны: nginx пропускает 100M (client_max_body_size в
; deploy/nginx-production.conf), и обрезать поток должен не PHP.
php_admin_value[upload_max_filesize] = 100M
php_admin_value[post_max_size] = 100M

; Отправка большого файла по медленному каналу занимает минуты, а приём
; занятого скрипта считается его временем работы.
php_admin_value[max_execution_time] = 120
php_admin_value[max_input_time] = 120

; Разбор загруженных изображений и чтение тегов у музыки держат файл в памяти
php_admin_value[memory_limit] = 256M

; ---- Ошибки ----------------------------------------------------------------
; Посетителю ошибки не показываем, но пишем их отдельно от общего syslog:
; свой файл в shared переживает выкаты и читается без прав root.
php_admin_flag[display_errors] = Off
php_admin_flag[display_startup_errors] = Off
php_admin_flag[log_errors] = On
php_admin_value[error_log] = /var/www/www-root/data/www/dcms.vadimushka-d.ru/shared/sys/logs/php-error.log

; ---- Прочее ----------------------------------------------------------------
; Версию PHP в заголовках не раскрываем
php_admin_flag[expose_php] = Off

; Идентификатор сессии — только в cookie. Подстановка в ссылки раздаёт чужие
; сессии вместе со ссылкой, и в PHP 8.5 эта возможность объявлена устаревшей.
php_admin_value[session.use_trans_sid] = 0
php_admin_value[session.use_only_cookies] = 1
php_admin_flag[session.cookie_httponly] = On
