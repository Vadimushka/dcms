name: deploy production

# Выкат запускается руками (Actions → deploy production → Run workflow) или
# публикацией релиза. Пуш в master сам по себе на боевой сайт не уезжает.
on:
    workflow_dispatch:
        inputs:
            first_deploy:
                description: 'Первый выкат: docroot сайта ещё не переключён на current'
                type: boolean
                default: false
    release:
        types: [published]

permissions:
    contents: read

concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    checks:
        uses: ./.github/workflows/checks.yml

    deploy:
        needs: checks
        runs-on: ubuntu-latest

        # Окружение ведёт журнал выкатов: какая версия когда уехала и кто её
        # запустил. Здесь же ограничение веток — выкатывать можно только с
        # master и по тегам версий.
        environment:
            name: production
            url: ${{ vars.SITE_URL }}

        steps:
            - name: Только master или релизная версия
              run: |
                  if [ "${{ github.event_name }}" = "release" ]; then
                      echo "Выкат релиза ${{ github.event.release.tag_name }}"
                  elif [ "${{ github.ref }}" = "refs/heads/master" ]; then
                      echo "Выкат ветки master"
                  else
                      echo "::error::Выкат разрешён только с master или по публикации релиза, запущено на ${{ github.ref }}"
                      exit 1
                  fi

            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  # Теги нужны, чтобы собрать версию сайта из последнего релиза
                  fetch-depth: 0

            # Версию показывает сам сайт, и по ней же движок решает, применимо
            # ли к нему обновление. Релиз даёт её тегом, ручной выкат —
            # последним тегом с отметкой коммита, чтобы отличать сборку с
            # master от опубликованной версии.
            - name: Определить версию
              run: |
                  if [ "${{ github.event_name }}" = "release" ]; then
                      version="${{ github.event.release.tag_name }}"
                  else
                      tag="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
                      version="${tag:-0.0.0}+$(git rev-parse --short HEAD)"
                  fi

                  # Версия попадает в настройки сайта: оставляем только то, что
                  # там безопасно и осмысленно выглядит.
                  version="${version#v}"
                  version="$(printf '%s' "$version" | tr -cd 'A-Za-z0-9.+_-')"

                  [ -n "$version" ] || { echo "::error::не удалось определить версию"; exit 1; }
                  echo "VERSION=$version" >> "$GITHUB_ENV"
                  echo "Версия сайта: $version"

            - name: Configure SSH
              run: |
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

            # На боевой сайт едет только код движка: composer-зависимостей у него
            # нет (в require один php), а стенд, проверки, документация и файлы
            # сборки там не нужны — и их пришлось бы закрывать от посетителей.
            - name: Upload release
              env:
                  TARGET: ${{ vars.DEPLOY_PATH }}/releases/${{ github.sha }}
                  REMOTE: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
              run: |
                  ssh "$REMOTE" "mkdir -p '$TARGET'"
                  # Ведущий слэш обязателен: без него rsync исключает каталог с
                  # таким именем на любой глубине. Шаблон 'docs' однажды уже
                  # выкинул из релиза sys/docs — правила сайта, справку и
                  # заготовки замечаний, отчего страница правил стала пустой.
                  rsync -az --delete \
                      --exclude '/.git' --exclude '/.github' --exclude '/vendor' \
                      --exclude '/docker' --exclude '/deploy' --exclude '/docs' \
                      --exclude '/tests' --exclude '/docker-compose.yml' \
                      --exclude '/.env.example' --exclude '/composer.json' \
                      --exclude '/composer.lock' --exclude '/phpstan*.neon' \
                      --exclude '/phpstan-bootstrap.php' \
                      ./ "$REMOTE:$TARGET/"

                  # Целостность релиза: точка входа, страницы, документы движка
                  # и описания таблиц. Пропажу любого из них посетитель видит
                  # раньше, чем мы, — страница просто пустеет.
                  for required in index.php pages/login.php sys/docs/rules.txt \
                      sys/preinstall/table.users.structure.json; do
                      ssh "$REMOTE" "test -e '$TARGET/$required'" \
                          || { echo "::error::в залитом релизе нет $required"; exit 1; }
                  done

            # Дамп базы, подключение shared, переключение current и сброс OPcache
            - name: Activate release
              env:
                  REMOTE: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
              run: |
                  ssh "$REMOTE" "APP='${{ vars.DEPLOY_PATH }}' SHA='${{ github.sha }}' VERSION='$VERSION' OPCACHE_OPTIONAL='${{ inputs.first_deploy && 1 || 0 }}' bash -s" \
                      < deploy/activate.sh

            # Набор ходит по страницам снаружи: сценарии входа и чтение лога PHP
            # против боевого адреса недоступны, о чём он сам сообщает в итоге.
            - name: Проверить сайт
              id: smoke
              if: ${{ !inputs.first_deploy }}
              run: bash tests/smoke/run.sh "${{ vars.SITE_URL }}"

            - name: Откат при непрошедшей проверке
              if: failure() && steps.smoke.outcome == 'failure'
              env:
                  REMOTE: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
              run: |
                  echo "::warning::Проверка сайта не прошла — возвращаю предыдущий релиз"
                  ssh "$REMOTE" "APP='${{ vars.DEPLOY_PATH }}' bash -s" < deploy/rollback.sh
                  echo "Состояние сайта после отката:"
                  bash tests/smoke/run.sh "${{ vars.SITE_URL }}" || true

            - name: Что делать после первого выката
              if: ${{ success() && inputs.first_deploy }}
              run: |
                  {
                      echo "### Релиз готов, сайт пока работает по-старому"
                      echo
                      echo "Дальше в ispmanager, одним заходом:"
                      echo "1. docroot сайта → \`${{ vars.DEPLOY_PATH }}/current\`"
                      echo "2. версия PHP → 8.1+ (на сервере есть 8.5), режим — nginx + PHP-FPM"
                      echo "3. правила доступа: \`deploy/nginx-production.conf\` → \`/etc/nginx/vhosts-resources/<домен>/dcms.conf\`, затем \`nginx -t && systemctl reload nginx\`"
                      echo "4. создать таблицу \`users_tokens\` в /dpanel/dev.update_tables.php"
                      echo
                      echo "Проверка: \`bash tests/smoke/run.sh ${{ vars.SITE_URL }}\`"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Итог
              if: ${{ success() && !inputs.first_deploy }}
              run: |
                  {
                      echo "### Выкат завершён"
                      echo
                      echo "- Релиз: \`${{ github.sha }}\`"
                      echo "- Сайт: ${{ vars.SITE_URL }}"
                      echo
                      echo "Откат: \`ssh <сервер> \"APP=<каталог сайта> bash -s\" < deploy/rollback.sh\`"
                  } >> "$GITHUB_STEP_SUMMARY"
