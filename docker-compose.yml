name: dcms

services:
    nginx:
        image: nginx:alpine
        ports:
            - "127.0.0.1:${APP_PORT:-8090}:80"
        volumes:
            - '.:/var/www/html'
            - './docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro'
        networks:
            - dcms
        depends_on:
            - php
    php:
        build:
            context: ./docker/php
            dockerfile: Dockerfile
            args:
                PHP_VERSION: ${PHP_VERSION:-8.5}
                UID: ${UID:-1000}
                GID: ${GID:-1000}
        volumes:
            - '.:/var/www/html'
        networks:
            - dcms
        depends_on:
            mysql:
                condition: service_healthy
    mysql:
        image: mysql:8.0
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
        ports:
            - "127.0.0.1:${DB_PORT:-33061}:3306"
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - dcms-mysql:/var/lib/mysql
        networks:
            - dcms
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD}"]
            interval: 5s
            retries: 20
            timeout: 5s
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        ports:
            - '127.0.0.1:${PHPMYADMIN_PORT:-8091}:80'
        environment:
            PMA_HOST: mysql
            PMA_USER: '${DB_USERNAME}'
            PMA_PASSWORD: '${DB_PASSWORD}'
        depends_on:
            - mysql
        networks:
            - dcms

networks:
    dcms:
        driver: bridge

volumes:
    dcms-mysql:
        driver: local
