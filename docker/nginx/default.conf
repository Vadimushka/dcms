server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    charset utf-8;
    autoindex off;

    # Редирект каталога без завершающего слеша (/forum -> /forum/) nginx по
    # умолчанию строит абсолютным, беря порт из listen: за проброшенным портом
    # (127.0.0.1:8090 -> 80) в Location уходил http://127.0.0.1/forum/ и браузер
    # попадал на чужой сервис. Относительный Location подставляет хост сам.
    absolute_redirect off;

    client_max_body_size 100M;

    # ---- Error pages ----
    error_page 400 /error.php?err=400;
    error_page 401 /error.php?err=401;
    error_page 402 /error.php?err=402;
    error_page 403 /error.php?err=403;
    error_page 404 /error.php?err=404;
    error_page 500 /error.php?err=500;
    error_page 502 /error.php?err=502;

    # ============================================================
    # Deny access (replaces "Deny from all" .htaccess rules)
    # ============================================================
    # Файлы разработки и выката. Прод разворачивается копированием каталога,
    # поэтому они окажутся в докруте: composer.json выдаёт состав зависимостей,
    # docs/deploy — весь сценарий выката с именами хостов, phpstan-bootstrap.php
    # исполняется по прямому запросу.
    location ^~ /vendor/         { deny all; }
    location ^~ /docs/           { deny all; }
    location ^~ /tests/          { deny all; }
    location ^~ /docker/         { deny all; }
    location ~* ^/(composer\.(json|lock)|docker-compose\.ya?ml|phpstan.*\.neon|phpstan-bootstrap\.php|package(-lock)?\.json)$ { deny all; }
    # Только в корне сайта: в /files/ лежат пользовательские файлы, и такие
    # расширения там законны — обменник не должен переставать их отдавать.
    location ~* ^/[^/]+\.(md|neon|dist|lock|sh|sql|bak|old|orig|swp|ya?ml)$ { deny all; }

    location ^~ /sys/inc/        { deny all; }
    location ^~ /sys/ini/        { deny all; }
    location ^~ /sys/docs/       { deny all; }
    location ^~ /sys/files/      { deny all; }
    location ^~ /sys/logs/       { deny all; }
    location ^~ /sys/plugins/    { deny all; }
    location ^~ /sys/templates/  { deny all; }
    location ^~ /sys/preinstall/ { deny all; }
    location ^~ /files/inc/      { deny all; }
    location ^~ /forum/inc/      { deny all; }
    location ^~ /install/inc/    { deny all; }
    location ^~ /sys/images/copyright/ { deny all; }
    location ^~ /sys/images/captcha/   { deny all; }

    # sys/images: serve static files, but never execute PHP
    location ^~ /sys/images/ {
        # ^~ выше отключает перебор regex-локаций, поэтому общий запрет
        # dotfiles из конца файла сюда не достаёт — повторяем его здесь
        location ~ /\. { deny all; }
        location ~ \.php$ { deny all; }
    }

    # sys/languages: block .lng and .ini
    location ^~ /sys/languages/ {
        # ^~ выше отключает перебор regex-локаций, поэтому общий запрет
        # dotfiles из конца файла сюда не достаёт — повторяем его здесь
        location ~ /\. { deny all; }
        location ~* \.(lng|ini)$ { deny all; }
    }

    # sys/themes: block .tpl, .php, .ini
    location ^~ /sys/themes/ {
        # ^~ выше отключает перебор regex-локаций, поэтому общий запрет
        # dotfiles из конца файла сюда не достаёт — повторяем его здесь
        location ~ /\. { deny all; }
        location ~* \.(tpl|php|ini)$ { deny all; }
    }

    # sys/widgets: block .php and .ini, except feed/feed.php
    location ^~ /sys/widgets/ {
        # ^~ выше отключает перебор regex-локаций, поэтому общий запрет
        # dotfiles из конца файла сюда не достаёт — повторяем его здесь
        location ~ /\. { deny all; }
        location = /sys/widgets/feed/feed.php {
            fastcgi_pass php:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
        location ~* \.(php|ini)$ { deny all; }
    }

    # sys/tmp: deny all except public.* files
    location ^~ /sys/tmp/ {
        # ^~ выше отключает перебор regex-локаций, поэтому общий запрет
        # dotfiles из конца файла сюда не достаёт — повторяем его здесь
        location ~ /\. { deny all; }
        location ~ ^/sys/tmp/public\. {
            allow all;
        }
        deny all;
    }

    # ============================================================
    # /forum/ rewrite: download/123/ -> file.get.php?id=123
    # ============================================================
    location ^~ /forum/ {
        # ^~ выше отключает перебор regex-локаций, поэтому общий запрет
        # dotfiles из конца файла сюда не достаёт — повторяем его здесь
        location ~ /\. { deny all; }
        location ~ ^/forum/download/([0-9]+)/ {
            rewrite ^/forum/download/([0-9]+)/ /forum/file.get.php?id=$1 last;
        }
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass php:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
        try_files $uri $uri/ =404;
    }

    # ============================================================
    # /files/ rewrite: anything -> index.php?path=$uri
    # ============================================================
    location ^~ /files/ {
        # ^~ выше отключает перебор regex-локаций, поэтому общий запрет
        # dotfiles из конца файла сюда не достаёт — повторяем его здесь
        location ~ /\. { deny all; }
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass php:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
        try_files $uri @files_rewrite;
    }

    location @files_rewrite {
        rewrite ^/files/(.*)$ /files/index.php?path=$1&$args last;
    }

    # ============================================================
    # /pages/ rewrite: bad_browser -> badbrowser.php
    # ============================================================
    location ^~ /pages/ {
        # ^~ выше отключает перебор regex-локаций, поэтому общий запрет
        # dotfiles из конца файла сюда не достаёт — повторяем его здесь
        location ~ /\. { deny all; }
        rewrite ^/pages/bad_?browser(\.html?|\.php)$ /pages/badbrowser.php last;
        location ~ \.php$ {
            try_files $uri =404;
            fastcgi_pass php:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
        try_files $uri $uri/ =404;
    }

    # ============================================================
    # PHP handler (main)
    # Если файл не найден в корне, пробуем pages/
    # (replaces: RewriteCond !-f, RewriteRule ^([^/]+)$ pages/$1)
    # ============================================================
    location ~ \.php$ {
        try_files $uri /pages$uri =404;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        include fastcgi_params;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Deny dotfiles
    location ~ /\. {
        deny all;
    }
}
