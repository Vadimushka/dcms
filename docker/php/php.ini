upload_max_filesize = 100M
post_max_size = 100M
default_charset = UTF-8
; Передача идентификатора сессии в URL: PHP 8.5 объявил её устаревшей,
; а сессия в адресе утекает через Referer и историю браузера. Движок
; включал её ради браузеров без поддержки COOKIE.
session.use_trans_sid = 0
arg_separator.output = "&amp;"

; Ошибки нужно видеть, но не в теле ответа: вывод до заголовков ломает
; session_start(), и движок уходит в die(). Пишем в stderr контейнера —
; читается через docker compose logs php, а страницы остаются целыми.
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL
log_errors = On
error_log = /proc/self/fd/2

; Правки файлов должны подхватываться сразу
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
